<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<!-- Фикс масштабирования пальцами на смартфонах -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Мессенджер</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EDE6D3;
    --paper2: #E3DAC2;
    --ink: #1C1A16;
    --wire: #1B3A8C;
    --stamp: #B23A2E;
    --muted: #8A8272;
    --msg-me: #1B3A8C;
    --msg-me-text: #EDE6D3;
    --me-bg: #1C1A16;
    --me-text: #EDE6D3;
  }

  /* Темы оформления (Исправлены контрасты) */
  body.theme-dark {
    --paper: #18191C;
    --paper2: #222428;
    --ink: #E3E5E8;
    --wire: #4E6AD0;
    --stamp: #E54B4B;
    --muted: #8E9297;
    --msg-me: #3B519B;
    --msg-me-text: #FFFFFF;
    --me-bg: #2B2D31;
    --me-text: #E3E5E8;
  }
  body.theme-matrix {
    --paper: #0D1117;
    --paper2: #161B22;
    --ink: #00FF66;
    --wire: #008833;
    --stamp: #00FF66;
    --muted: #008833;
    --msg-me: #003311;
    --msg-me-text: #00FF66;
    --me-bg: #161B22;
    --me-text: #00FF66;
  }
  body.theme-cyber {
    --paper: #2B0938;
    --paper2: #3B0D4B;
    --ink: #00F0FF;
    --wire: #FF0055;
    --stamp: #FFE600;
    --muted: #A135B8;
    --msg-me: #FF0055;
    --msg-me-text: #FFFFFF;
    --me-bg: #3B0D4B;
    --me-text: #00F0FF;
  }

  * { box-sizing: border-box; touch-action: manipulation; }
  body {
    margin: 0; font-family: 'JetBrains Mono', monospace;
    background: var(--paper);
    background-image: repeating-linear-gradient(0deg, rgba(0,0,0,.025) 0px, rgba(0,0,0,.025) 1px, transparent 1px, transparent 3px);
    color: var(--ink); height: 100vh; height: 100dvh; overflow: hidden;
    user-select: none;
  }
  h1, .tab { font-family: 'Special Elite', monospace; }
  #app { display: flex; height: 100vh; height: 100dvh; width: 100vw; }

  /* ---------- Auth ---------- */
  #authScreen {
    width: 100%; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 20% 20%, rgba(27,58,140,.06), transparent 40%), var(--paper);
  }
  .authBox {
    background: var(--paper2); padding: 32px; width: 340px; max-width: 90vw;
    border: 2px solid var(--ink); box-shadow: 7px 7px 0 var(--ink); position: relative;
  }
  .authBox::before {
    content: "№ 001 · PRIVATE WIRE"; position: absolute; top: -11px; left: 20px;
    background: var(--paper); padding: 0 8px; font-size: 10px; letter-spacing: 2px; color: var(--muted);
  }
  .authBox h1 { margin: 0 0 4px; font-size: 24px; letter-spacing: 1px; }
  .authBox p { color: var(--muted); font-size: 12px; margin: 0 0 20px; text-transform: uppercase; letter-spacing: 1px; }
  .authBox input {
    width: 100%; padding: 12px; margin-bottom: 10px; border: 2px solid var(--ink);
    background: var(--paper); color: var(--ink); font-size: 14px; font-family: 'JetBrains Mono', monospace;
  }
  .authBox input:focus { outline: 3px solid var(--wire); outline-offset: 1px; }
  .authBox button {
    width: 100%; padding: 12px; border: 2px solid var(--ink); background: var(--wire);
    color: var(--paper); font-size: 13px; font-weight: 700; letter-spacing: 1.5px;
    text-transform: uppercase; cursor: pointer; margin-top: 6px; box-shadow: 4px 4px 0 var(--ink); transition: transform .05s;
  }
  .authBox button:active { transform: translate(4px,4px); box-shadow: 0 0 0 var(--ink); }
  .authBox .switch { color: var(--muted); font-size: 12px; text-align: center; margin-top: 16px; cursor: pointer; }
  .authBox .switch b { color: var(--stamp); }
  .err { color: var(--stamp); font-size: 12px; margin-top: 6px; min-height: 16px; font-weight: 700; }

  /* ---------- Layout ---------- */
  #mainScreen { display: none; width: 100%; height: 100%; }
  #sidebar { width: 320px; min-width: 320px; background: var(--paper2); border-right: 2px solid var(--ink); display: flex; flex-direction: column; }
  
  /* Фикс фиолетового/черного блока профиля */
  #me { padding: 14px 16px; border-bottom: 2px solid var(--ink); display: flex; align-items: center; gap: 10px; background: var(--me-bg); color: var(--me-text); cursor: pointer; }
  #me .avatar { width: 36px; height: 36px; font-size: 14px; flex-shrink: 0; }
  #me .name { font-weight: 700; font-family: 'Special Elite', monospace; color: var(--me-text); letter-spacing: 1px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #logoutBtn { background: none; border: 1px solid var(--me-text); color: var(--me-text); cursor: pointer; font-size: 11px; padding: 5px 9px; text-transform: uppercase; letter-spacing: 1px; }

  .tabs { display: flex; border-bottom: 2px solid var(--ink); }
  .tab { flex: 1; text-align: center; padding: 10px; font-size: 12px; color: var(--muted); cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
  .tab.active { color: var(--ink); background: var(--paper); border-bottom: 3px solid var(--stamp); margin-bottom: -2px; }

  #searchBox, #addFriendBox { padding: 8px 14px; border-bottom: 2px dashed var(--ink); display: flex; gap: 6px; }
  #searchBox input, #addFriendBox input { flex: 1; padding: 8px 10px; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); font-size: 13px; font-family: 'JetBrains Mono', monospace; }
  #addFriendBox button { padding: 8px 12px; border: 2px solid var(--ink); background: var(--stamp); color: var(--paper); cursor: pointer; font-size: 12px; font-weight: 700; text-transform: uppercase; }

  #list { flex: 1; overflow-y: auto; }
  .row { padding: 12px 16px; display: flex; align-items: center; gap: 10px; cursor: pointer; border-bottom: 1px dashed rgba(0,0,0,0.15); }
  .row:hover { background: var(--paper); }
  .row.active { background: var(--paper); box-shadow: inset 4px 0 0 var(--wire); }
  
  .avatar {
    width: 40px; height: 40px; background: var(--wire); color: var(--paper);
    border: 2px solid var(--ink); display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 16px; flex-shrink: 0; font-family: 'Special Elite', monospace;
    background-size: cover; background-position: center; border-radius: 4px; position: relative;
  }
  .onlineStatus { width: 10px; height: 10px; background: #2ecc71; border: 2px solid var(--ink); border-radius: 50%; position: absolute; bottom: -2px; right: -2px; }
  
  .rowInfo { flex: 1; min-width: 0; }
  .rowInfo .n { font-size: 14px; font-weight: 700; }
  .rowInfo .s { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: uppercase; letter-spacing: .5px; }
  .reqBtns { display: flex; gap: 6px; }
  .reqBtns button { border: 2px solid var(--ink); padding: 6px 9px; font-size: 12px; cursor: pointer; font-weight: 700; }
  .accept { background: var(--wire); color: var(--paper); }
  .decline { background: var(--paper); color: var(--ink); }
  .empty { padding: 20px; color: var(--muted); font-size: 12px; text-align: center; text-transform: uppercase; letter-spacing: 1px; }

  /* ---------- Chat ---------- */
  #chatArea { flex: 1; display: flex; flex-direction: column; background: var(--paper); }
  #chatHeader { padding: 12px 20px; border-bottom: 2px solid var(--ink); font-weight: 700; display: flex; align-items: center; gap: 10px; background: var(--paper2); letter-spacing: .5px; }
  #chatHeader .sub { font-size: 11px; color: var(--stamp); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; min-height: 14px; display: flex; align-items: center; gap: 4px; }
  #chatHeader .hdrText { display: flex; flex-direction: column; }
  
  #pinnedBar { padding: 8px 16px; background: var(--paper2); border-bottom: 2px dashed var(--ink); font-size: 12px; display: none; justify-content: space-between; align-items: center; }
  #pinnedBar.show { display: flex; }
  #pinnedBar .pinText { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 80%; }
  #pinnedBar button { border: 1px solid var(--ink); background: var(--paper); cursor: pointer; font-size: 10px; padding: 2px 6px; }

  #noChatSelected { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: 2px; }
  #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  
  .msgWrap { display: flex; flex-direction: column; max-width: 75%; }
  .msgWrap.me { align-self: flex-end; align-items: flex-end; }
  .msgWrap.other { align-self: flex-start; align-items: flex-start; }
  .msg { padding: 10px 14px; font-size: 14px; line-height: 1.5; word-break: break-word; border: 2px solid var(--ink); position: relative; cursor: pointer; max-width: 100%; user-select: text; }
  .msg.me { background: var(--msg-me); color: var(--msg-me-text); box-shadow: 3px 3px 0 var(--ink); }
  .msg.other { background: var(--paper2); color: var(--ink); box-shadow: -3px 3px 0 var(--ink); }
  .msg img { max-width: 100%; max-height: 250px; display: block; border: 1px solid var(--ink); margin-bottom: 6px; border-radius: 2px; }
  .msg .t { font-size: 10px; opacity: .7; margin-top: 5px; display: flex; justify-content: flex-end; gap: 4px; text-transform: uppercase; letter-spacing: 1px; }
  
  .msgActions { display: none; position: absolute; top: -12px; right: 4px; background: var(--paper2); border: 1px solid var(--ink); gap: 2px; z-index: 10; padding: 2px; }
  .msg:hover .msgActions { display: flex; }
  .msgActions button { background: var(--paper); border: 1px solid var(--ink); color: var(--ink); font-size: 10px; cursor: pointer; padding: 1px 4px; }

  .reactions { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
  .reactionPill { background: var(--paper2); border: 1px solid var(--ink); border-radius: 10px; padding: 1px 7px; font-size: 12px; cursor: pointer; color: var(--ink); }
  .reactionPill.mine { background: var(--wire); color: var(--paper); }
  .emojiBar { display: none; gap: 4px; background: var(--paper2); border: 2px solid var(--ink); padding: 5px 7px; box-shadow: 3px 3px 0 var(--ink); margin-top: 4px; }
  .emojiBar.show { display: flex; }
  .emojiBar span { cursor: pointer; font-size: 17px; transition: transform 0.1s; }
  .emojiBar span:hover { transform: scale(1.2); }

  #inputBar { padding: 12px; border-top: 2px solid var(--ink); display: flex; gap: 8px; background: var(--paper2); align-items: center; }
  #inputBar input[type=text] { flex: 1; padding: 12px 14px; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); font-size: 14px; font-family: 'JetBrains Mono', monospace; }
  #inputBar button { padding: 0 18px; height: 44px; border: 2px solid var(--ink); background: var(--stamp); color: var(--paper); font-weight: 700; cursor: pointer; box-shadow: 3px 3px 0 var(--ink); }
  #inputBar button:active { transform: translate(3px,3px); box-shadow: 0 0 0 var(--ink); }
  #inputBar .iconBtn { background: var(--paper); color: var(--ink); padding: 0 12px; font-size: 16px; }
  #inputBar .recActive { background: #e74c3c !important; color: white !important; animation: pulse 1s infinite; }

  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

  #imgPreviewBar { display: none; padding: 8px 14px; background: var(--paper2); border-top: 2px dashed var(--ink); align-items: center; gap: 8px; }
  #imgPreviewBar.show { display: flex; }
  #imgPreviewBar img { max-height: 60px; border: 2px solid var(--ink); }
  #imgPreviewBar button { border: 2px solid var(--ink); background: var(--stamp); color: var(--paper); padding: 4px 10px; cursor: pointer; font-size: 11px; text-transform: uppercase; }

  /* Анимация "Печатает..." */
  .typingDots span { animation: blink 1.4s infinite repeating-linear-gradient; font-weight: bold; }
  .typingDots span:nth-child(2) { animation-delay: .2s; }
  .typingDots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0% { opacity: .2; } 20% { opacity: 1; } 100% { opacity: .2; } }

  /* ---------- Мобильная адаптация ---------- */
  #backBtn { display: none; background: none; border: 2px solid var(--ink); color: var(--ink); font-size: 16px; font-weight: bold; cursor: pointer; padding: 4px 8px; margin-right: 6px; }

  @media (max-width: 720px) {
    #sidebar { width: 100%; min-width: 0; border-right: none; }
    #chatArea { display: none; }
    body.chatOpen #sidebar { display: none; }
    body.chatOpen #chatArea { display: flex; }
    #backBtn { display: inline-block !important; }
    .msgWrap { max-width: 88%; }
  }

  /* ---------- Modal (Профиль и Настройки) ---------- */
  .modalOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 50; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
  .modalOverlay.show { display: flex; }
  .modalBox { background: var(--paper2); border: 2px solid var(--ink); box-shadow: 7px 7px 0 var(--ink); padding: 24px; width: 360px; max-width: 90vw; max-height: 90vh; overflow-y: auto; position: relative; }
  .modalBox h2 { margin: 0 0 16px; font-size: 20px; font-family: 'Special Elite', monospace; }
  .modalBox label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 4px; margin-top: 12px; }
  .modalBox input, .modalBox select { width: 100%; padding: 10px; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); font-size: 14px; font-family: 'JetBrains Mono', monospace; }
  .colorRow { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
  .colorDot { width: 28px; height: 28px; border: 2px solid var(--ink); cursor: pointer; border-radius: 50%; }
  .colorDot.picked { outline: 3px solid var(--stamp); outline-offset: 2px; }
  .modalBox .row2 { display: flex; gap: 8px; margin-top: 20px; }
  .modalBox .row2 button { flex: 1; padding: 11px; border: 2px solid var(--ink); cursor: pointer; font-weight: 700; text-transform: uppercase; font-size: 12px; box-shadow: 3px 3px 0 var(--ink); }
  .modalBox .save { background: var(--wire); color: var(--paper); }
  .modalBox .close { background: var(--paper); color: var(--ink); }
  .modalErr { color: var(--stamp); font-size: 12px; margin-top: 8px; min-height: 14px; font-weight: 700; }
  
  .avatarUpload { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
  .avatarUpload button { padding: 8px; border: 2px solid var(--ink); background: var(--paper); cursor: pointer; font-size: 11px; text-transform: uppercase; font-weight: bold; }
  audio { max-width: 200px; height: 36px; margin-top: 4px; }
</style>
</head>
<body>

<div id="app">
  <!-- AUTH -->
  <div id="authScreen">
    <div class="authBox">
      <h1 id="authTitle">Вход</h1>
      <p id="authSubtitle">Войдите, чтобы продолжить</p>
      <input id="usernameInput" placeholder="Юзернейм (для регистрации)" style="display:none;">
      <input id="emailInput" placeholder="Email" type="email">
      <input id="passInput" placeholder="Пароль" type="password">
      <button id="authSubmitBtn">Войти</button>
      <div class="err" id="authErr"></div>
      <div class="switch" id="authSwitch">Нет аккаунта? <b>Зарегистрироваться</b></div>
    </div>
  </div>

  <!-- MAIN -->
  <div id="mainScreen">
    <div id="sidebar">
      <div id="me">
        <div class="avatar" id="myAvatar">?</div>
        <div class="name" id="myName">...</div>
        <button id="logoutBtn">Выйти</button>
      </div>
      <div id="addFriendBox">
        <input id="friendInput" placeholder="Юзернейм друга">
        <button id="addFriendBtn">Добавить</button>
      </div>
      <div id="searchBox">
        <input id="searchInput" placeholder="🔍 Поиск контактов...">
      </div>
      <div class="tabs">
        <div class="tab active" data-tab="chats">Чаты</div>
        <div class="tab" data-tab="requests">Заявки <span id="reqBadge"></span></div>
      </div>
      <div id="list"></div>
    </div>
    <div id="chatArea">
      <div id="noChatSelected">Выберите чат слева</div>
    </div>
  </div>
</div>

<!-- Модальное окно профиля и настроек -->
<div class="modalOverlay" id="profileModal">
  <div class="modalBox">
    <h2>Настройки профиля</h2>
    
    <label>Аватарка</label>
    <div class="avatarUpload">
      <div class="avatar" id="editAvatarPreview">?</div>
      <button id="uploadAvatarBtn">Загрузить фото</button>
      <button id="removeAvatarBtn">Сбросить</button>
    </div>

    <label>Юзернейм</label>
    <input id="editUsername" maxlength="20">

    <label>Цвет профиля (если нет фото)</label>
    <div class="colorRow" id="colorRow"></div>

    <label>Тема оформления (Кастомизация)</label>
    <select id="themeSelect">
      <option value="paper">📜 Бумага (Paper)</option>
      <option value="dark">🌙 Ночная (Noir)</option>
      <option value="matrix">🟢 Матрица (Terminal)</option>
      <option value="cyber">👾 Киберпанк (Neon)</option>
    </select>

    <div class="modalErr" id="profileErr"></div>
    <div class="row2">
      <button class="close" id="profileCloseBtn">Отмена</button>
      <button class="save" id="profileSaveBtn">Сохранить</button>
    </div>
  </div>
</div>

<input type="file" id="imgFileInput" accept="image/*" style="display:none;">
<input type="file" id="avatarFileInput" accept="image/*" style="display:none;">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
/* =======================================================
   FIREBASE CONFIG
   ======================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyAQJ1aWmizhddQINv9ilTEb-mKLXR6Yn1c",
  authDomain: "slygram-a10d1.firebaseapp.com",
  projectId: "slygram-a10d1",
  storageBucket: "slygram-a10d1.firebasestorage.app",
  messagingSenderId: "352496417787",
  appId: "1:352496417787:web:3902f252ab1fb1fe29295e"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const AVATAR_COLORS = ['#1B3A8C','#B23A2E','#2E7D32','#8E44AD','#B8860B','#455A64'];

let isLogin = true;
let isRegistering = false;
let currentUser = null;
let myUsername = null;
let myColor = AVATAR_COLORS[0];
let myPhoto = null;
let myTheme = 'paper';
let customAvatarData = null;

let myFriends = [];
let incomingRequests = [];
let activeChatWith = null;
let unsubMessages = null;
let unsubFriendsA = null, unsubFriendsB = null;
let unsubRequests = null;
let unsubChatMeta = null;
let activeTab = 'chats';
let friendsAccepted = { asFrom: [], asTo: [] };
let pendingImage = null;
let editingMsgId = null;

// Голосовые
let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;

/* ---------------- AUTH UI ---------------- */
const authTitle = document.getElementById('authTitle');
const authSubtitle = document.getElementById('authSubtitle');
const usernameInput = document.getElementById('usernameInput');
const emailInput = document.getElementById('emailInput');
const passInput = document.getElementById('passInput');
const authErr = document.getElementById('authErr');
const authSwitch = document.getElementById('authSwitch');
const authSubmitBtn = document.getElementById('authSubmitBtn');

authSwitch.onclick = () => {
  isLogin = !isLogin;
  authTitle.textContent = isLogin ? 'Вход' : 'Регистрация';
  authSubtitle.textContent = isLogin ? 'Войдите, чтобы продолжить' : 'Придумайте данные для входа';
  usernameInput.style.display = isLogin ? 'none' : 'block';
  authSubmitBtn.textContent = isLogin ? 'Войти' : 'Зарегистрироваться';
  authSwitch.innerHTML = isLogin ? 'Нет аккаунта? <b>Зарегистрироваться</b>' : 'Уже есть аккаунт? <b>Войти</b>';
  authErr.textContent = '';
};

authSubmitBtn.onclick = async () => {
  authErr.textContent = '';
  const email = emailInput.value.trim();
  const pass = passInput.value;
  if (!email || !pass) { authErr.textContent = 'Заполните email и пароль'; return; }

  const originalText = authSubmitBtn.textContent;
  authSubmitBtn.disabled = true;

  try {
    if (isLogin) {
      await auth.signInWithEmailAndPassword(email, pass);
    } else {
      const username = usernameInput.value.trim().toLowerCase();
      if (!/^[a-z0-9_]{3,20}$/.test(username)) {
        authErr.textContent = 'Юзернейм: 3-20 символов, латиница/цифры/_';
        return;
      }
      const taken = await db.collection('usernames').doc(username).get();
      if (taken.exists) { authErr.textContent = 'Этот юзернейм уже занят'; return; }

      isRegistering = true;
      const color = AVATAR_COLORS[Math.floor(Math.random()*AVATAR_COLORS.length)];
      const cred = await auth.createUserWithEmailAndPassword(email, pass);
      const uid = cred.user.uid;

      await db.collection('usernames').doc(username).set({ uid });
      await db.collection('users').doc(uid).set({
        username, email, color, photo: null, theme: 'paper',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      isRegistering = false;
      await enterApp(cred.user, username, color, null, 'paper');
    }
  } catch (e) {
    authErr.textContent = translateError(e.code) || e.message;
  } finally {
    isRegistering = false;
    authSubmitBtn.disabled = false;
    authSubmitBtn.textContent = originalText;
  }
};

function translateError(code){
  const map = {
    'auth/email-already-in-use': 'Этот email уже используется',
    'auth/invalid-email': 'Некорректный email',
    'auth/weak-password': 'Пароль слишком простой (мин. 6 символов)',
    'auth/user-not-found': 'Пользователь не найден',
    'auth/wrong-password': 'Неверный пароль'
  };
  return map[code];
}

document.getElementById('logoutBtn').onclick = () => auth.signOut();

/* ---------------- AUTH STATE ---------------- */
async function enterApp(user, username, color, photo, theme){
  currentUser = user;
  myUsername = username;
  myColor = color || AVATAR_COLORS[0];
  myPhoto = photo || null;
  myTheme = theme || 'paper';
  
  applyTheme(myTheme);
  
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('mainScreen').style.display = 'flex';
  document.getElementById('myName').textContent = '@' + myUsername;
  
  renderAvatar(document.getElementById('myAvatar'), myUsername, myColor, myPhoto);
  
  updateUserPresence();
  listenFriends();
  listenRequests();
}

function updateUserPresence() {
  if (!currentUser) return;
  const userRef = db.collection('users').doc(currentUser.uid);
  userRef.update({ lastOnline: firebase.firestore.FieldValue.serverTimestamp() });
  setInterval(() => {
    if (currentUser) userRef.update({ lastOnline: firebase.firestore.FieldValue.serverTimestamp() });
  }, 30000);
}

function applyTheme(theme) {
  document.body.className = '';
  if (theme && theme !== 'paper') {
    document.body.classList.add('theme-' + theme);
  }
}

function renderAvatar(el, username, color, photo, isOnline = false) {
  if (photo) {
    el.style.backgroundImage = `url(${photo})`;
    el.textContent = '';
  } else {
    el.style.backgroundImage = 'none';
    el.style.background = color || '#1B3A8C';
    el.textContent = username ? username[0].toUpperCase() : '?';
  }
  let dot = el.querySelector('.onlineStatus');
  if (isOnline) {
    if (!dot) {
      dot = document.createElement('div');
      dot.className = 'onlineStatus';
      el.appendChild(dot);
    }
  } else if (dot) {
    dot.remove();
  }
}

auth.onAuthStateChanged(async (user) => {
  if (user) {
    if (isRegistering) return;
    currentUser = user;
    const doc = await db.collection('users').doc(user.uid).get();
    if (!doc.exists) {
      auth.signOut();
      return;
    }
    const d = doc.data();
    await enterApp(user, d.username, d.color, d.photo, d.theme);
  } else {
    currentUser = null; myUsername = null;
    if (unsubFriendsA) unsubFriendsA();
    if (unsubFriendsB) unsubFriendsB();
    if (unsubRequests) unsubRequests();
    if (unsubMessages) unsubMessages();
    if (unsubChatMeta) unsubChatMeta();
    document.getElementById('authScreen').style.display = 'flex';
    document.getElementById('mainScreen').style.display = 'none';
  }
});

/* ---------------- ПРОФИЛЬ И КАСТОМИЗАЦИЯ ---------------- */
const profileModal = document.getElementById('profileModal');
const colorRow = document.getElementById('colorRow');
let pickedColor = myColor;

AVATAR_COLORS.forEach(c => {
  const dot = document.createElement('div');
  dot.className = 'colorDot';
  dot.style.background = c;
  dot.onclick = () => {
    pickedColor = c;
    document.querySelectorAll('.colorDot').forEach(d=>d.classList.remove('picked'));
    dot.classList.add('picked');
  };
  colorRow.appendChild(dot);
});

document.getElementById('me').onclick = () => {
  document.getElementById('editUsername').value = myUsername;
  document.getElementById('themeSelect').value = myTheme || 'paper';
  pickedColor = myColor;
  customAvatarData = myPhoto;
  
  renderAvatar(document.getElementById('editAvatarPreview'), myUsername, pickedColor, customAvatarData);
  document.querySelectorAll('.colorDot').forEach(d => d.classList.toggle('picked', d.style.background === myColor));
  document.getElementById('profileErr').textContent = '';
  profileModal.classList.add('show');
};

document.getElementById('uploadAvatarBtn').onclick = () => document.getElementById('avatarFileInput').click();
document.getElementById('avatarFileInput').onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  customAvatarData = await resizeImage(file, 200, 0.7);
  renderAvatar(document.getElementById('editAvatarPreview'), myUsername, pickedColor, customAvatarData);
};
document.getElementById('removeAvatarBtn').onclick = () => {
  customAvatarData = null;
  renderAvatar(document.getElementById('editAvatarPreview'), myUsername, pickedColor, null);
};

document.getElementById('profileCloseBtn').onclick = () => profileModal.classList.remove('show');

document.getElementById('profileSaveBtn').onclick = async () => {
  const errEl = document.getElementById('profileErr');
  errEl.textContent = '';
  const newUsername = document.getElementById('editUsername').value.trim().toLowerCase();
  const selectedTheme = document.getElementById('themeSelect').value;

  if (!/^[a-z0-9_]{3,20}$/.test(newUsername)) {
    errEl.textContent = 'Юзернейм: 3-20 символов, латиница/цифры/_';
    return;
  }
  try {
    if (newUsername !== myUsername) {
      const taken = await db.collection('usernames').doc(newUsername).get();
      if (taken.exists) { errEl.textContent = 'Этот юзернейм уже занят'; return; }
      await db.collection('usernames').doc(newUsername).set({ uid: currentUser.uid });
      await db.collection('usernames').doc(myUsername).delete();
    }
    
    await db.collection('users').doc(currentUser.uid).update({
      username: newUsername,
      color: pickedColor,
      photo: customAvatarData,
      theme: selectedTheme
    });

    myUsername = newUsername; myColor = pickedColor; myPhoto = customAvatarData; myTheme = selectedTheme;
    applyTheme(myTheme);

    document.getElementById('myName').textContent = '@' + myUsername;
    renderAvatar(document.getElementById('myAvatar'), myUsername, myColor, myPhoto);

    profileModal.classList.remove('show');
  } catch (e) {
    errEl.textContent = e.message || 'Ошибка сохранения';
  }
};

/* ---------------- ДОБАВЛЕНИЕ И ПОИСК ---------------- */
document.getElementById('addFriendBtn').onclick = async () => {
  const input = document.getElementById('friendInput');
  const target = input.value.trim().toLowerCase();
  if (!target || target === myUsername) return;

  const targetDoc = await db.collection('usernames').doc(target).get();
  if (!targetDoc.exists) { alert('Пользователь не найден'); return; }

  const targetUid = targetDoc.data().uid;
  const reqId = `${currentUser.uid}_${targetUid}`;
  await db.collection('friendRequests').doc(reqId).set({
    from: currentUser.uid, fromUsername: myUsername,
    to: targetUid, toUsername: target, status: 'pending',
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  input.value = '';
  alert('Заявка отправлена!');
};

document.getElementById('searchInput').oninput = (e) => {
  renderList(e.target.value.trim().toLowerCase());
};

/* ---------------- ЗАЯВКИ И СПИСОК ---------------- */
function listenRequests(){
  unsubRequests = db.collection('friendRequests')
    .where('to', '==', currentUser.uid)
    .where('status', '==', 'pending')
    .onSnapshot(snap => {
      incomingRequests = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      document.getElementById('reqBadge').textContent = incomingRequests.length ? `(${incomingRequests.length})` : '';
      if (activeTab === 'requests') renderList();
    });
}

async function acceptRequest(req){
  await db.collection('friendRequests').doc(req.id).update({ status: 'accepted' });
}
async function declineRequest(req){
  await db.collection('friendRequests').doc(req.id).update({ status: 'declined' });
}

async function rebuildFriendsList(){
  const map = new Map();
  friendsAccepted.asFrom.forEach(r => map.set(r.to, r.toUsername));
  friendsAccepted.asTo.forEach(r => map.set(r.from, r.fromUsername));
  const uids = [...map.keys()];
  if (uids.length === 0) { myFriends = []; if (activeTab==='chats') renderList(); return; }
  const docs = await Promise.all(uids.map(uid => db.collection('users').doc(uid).get()));
  myFriends = docs.filter(d=>d.exists).map(d => ({ uid: d.id, ...d.data() }));
  if (activeTab === 'chats') renderList();
}

function listenFriends(){
  unsubFriendsA = db.collection('friendRequests')
    .where('from','==',currentUser.uid).where('status','==','accepted')
    .onSnapshot(snap => { friendsAccepted.asFrom = snap.docs.map(d=>d.data()); rebuildFriendsList(); });
  unsubFriendsB = db.collection('friendRequests')
    .where('to','==',currentUser.uid).where('status','==','accepted')
    .onSnapshot(snap => { friendsAccepted.asTo = snap.docs.map(d=>d.data()); rebuildFriendsList(); });
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    activeTab = tab.dataset.tab;
    renderList();
  };
});

function renderList(filter = ''){
  const list = document.getElementById('list');
  list.innerHTML = '';
  if (activeTab === 'chats') {
    const filtered = myFriends.filter(f => f.username.toLowerCase().includes(filter));
    if (filtered.length === 0) {
      list.innerHTML = '<div class="empty">Чаты не найдены</div>';
      return;
    }
    filtered.forEach(f => {
      const row = document.createElement('div');
      row.className = 'row' + (activeChatWith && activeChatWith.uid === f.uid ? ' active' : '');
      const avContainer = document.createElement('div');
      avContainer.className = 'avatar';
      
      const isOnline = f.lastOnline && (Date.now() - f.lastOnline.toMillis() < 60000);
      renderAvatar(avContainer, f.username, f.color, f.photo, isOnline);

      row.appendChild(avContainer);
      row.innerHTML += `<div class="rowInfo"><div class="n">@${f.username}</div><div class="s">${isOnline ? 'В сети' : 'Офлайн'}</div></div>`;
      row.onclick = () => openChat(f);
      list.appendChild(row);
    });
  } else {
    if (incomingRequests.length === 0) {
      list.innerHTML = '<div class="empty">Нет заявок</div>';
      return;
    }
    incomingRequests.forEach(r => {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `
        <div class="avatar">${r.fromUsername[0].toUpperCase()}</div>
        <div class="rowInfo"><div class="n">@${r.fromUsername}</div><div class="s">Хочет дружить</div></div>
        <div class="reqBtns">
          <button class="accept">✓</button>
          <button class="decline">✕</button>
        </div>
      `;
      row.querySelector('.accept').onclick = (e) => { e.stopPropagation(); acceptRequest(r); };
      row.querySelector('.decline').onclick = (e) => { e.stopPropagation(); declineRequest(r); };
      list.appendChild(row);
    });
  }
}

/* ---------------- ЧАТ И ИНДИКАТОР ПЕЧАТИ ---------------- */
const REACTION_EMOJIS = ['👍','❤️','😂','😮','🔥'];
function chatIdFor(uidA, uidB){ return [uidA, uidB].sort().join('_'); }

function openChat(friend){
  activeChatWith = friend;
  editingMsgId = null;
  document.body.classList.add('chatOpen');
  renderList();

  const chatArea = document.getElementById('chatArea');
  chatArea.innerHTML = `
    <div id="chatHeader">
      <button id="backBtn">←</button>
      <div class="avatar" id="hdrAvatar"></div>
      <div class="hdrText">
        <div>@${friend.username}</div>
        <div class="sub" id="typingIndicator"></div>
      </div>
    </div>
    <div id="pinnedBar">
      <div class="pinText" id="pinnedContent">Закрепленное сообщение</div>
      <button id="unpinBtn">Открепить</button>
    </div>
    <div id="messages"></div>
    <div id="imgPreviewBar"><img id="imgPreviewThumb"><span>Картинка готова</span><button id="imgCancelBtn">Убрать</button></div>
    <div id="inputBar">
      <button class="iconBtn" id="attachBtn" title="Фото">📎</button>
      <button class="iconBtn" id="voiceBtn" title="Голосовое сообщение">🎙️</button>
      <input id="msgInput" type="text" placeholder="Сообщение...">
      <button id="sendBtn">➤</button>
    </div>
  `;

  renderAvatar(document.getElementById('hdrAvatar'), friend.username, friend.color, friend.photo);
  document.getElementById('backBtn').onclick = () => document.body.classList.remove('chatOpen');

  const cid = chatIdFor(currentUser.uid, friend.uid);

  // Слушатель закрепа и печати
  if (unsubChatMeta) unsubChatMeta();
  unsubChatMeta = db.collection('chats').doc(cid).onSnapshot(doc => {
    const ind = document.getElementById('typingIndicator');
    const pinnedBar = document.getElementById('pinnedBar');
    const pinnedContent = document.getElementById('pinnedContent');
    
    if (!doc.exists) return;
    const data = doc.data();

    // Индикатор печати
    const t = data.typing || {};
    const otherTs = t[friend.uid];
    if (ind) {
      if (otherTs && (Date.now() - otherTs.toMillis()) < 3500) {
        ind.innerHTML = `печатает<span class="typingDots"><span>.</span><span>.</span><span>.</span></span>`;
      } else {
        ind.textContent = '';
      }
    }

    // Закрепленное сообщение
    if (data.pinnedMsg) {
      pinnedBar.classList.add('show');
      pinnedContent.textContent = "📌 " + (data.pinnedMsg.text || (data.pinnedMsg.audio ? "Голосовое сообщение" : "Изображение"));
      document.getElementById('unpinBtn').onclick = () => {
        db.collection('chats').doc(cid).update({ pinnedMsg: firebase.firestore.FieldValue.delete() });
      };
    } else {
      pinnedBar.classList.remove('show');
    }
  });

  // Сообщения
  if (unsubMessages) unsubMessages();
  unsubMessages = db.collection('chats').doc(cid).collection('messages')
    .orderBy('createdAt', 'asc')
    .onSnapshot(snap => {
      const box = document.getElementById('messages');
      if (!box) return;
      box.innerHTML = '';
      snap.forEach(doc => {
        const m = doc.data();
        const mine = m.from === currentUser.uid;
        const wrap = document.createElement('div');
        wrap.className = 'msgWrap ' + (mine ? 'me' : 'other');

        const div = document.createElement('div');
        div.className = 'msg ' + (mine ? 'me' : 'other');
        const time = m.createdAt ? m.createdAt.toDate().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '';
        
        let inner = '';
        if (m.image) inner += `<img src="${m.image}">`;
        if (m.audio) inner += `<audio controls src="${m.audio}"></audio>`;
        if (m.text) inner += escapeHtml(m.text) + (m.isEdited ? ' <small style="opacity:0.6">(изм.)</small>' : '');
        inner += `<span class="t">${time}</span>`;
        
        // Кнопки управления сообщением
        inner += `
          <div class="msgActions">
            <button class="pinBtn" title="Закрепить">📌</button>
            ${mine && m.text ? '<button class="editBtn" title="Редактировать">✏️</button>' : ''}
            ${mine ? '<button class="delBtn" title="Удалить">✕</button>' : ''}
          </div>
        `;
        
        div.innerHTML = inner;

        // Обработчики кнопок
        const pinBtn = div.querySelector('.pinBtn');
        if (pinBtn) pinBtn.onclick = (e) => { e.stopPropagation(); pinMessage(cid, m); };

        if (mine) {
          const del = div.querySelector('.delBtn');
          if (del) del.onclick = (e) => { e.stopPropagation(); deleteMessage(cid, doc.id); };

          const edit = div.querySelector('.editBtn');
          if (edit) edit.onclick = (e) => { e.stopPropagation(); startEditMessage(doc.id, m.text); };
        }

        div.onclick = () => toggleEmojiBar(bar);
        wrap.appendChild(div);

        // Реакции
        const reactions = m.reactions || {};
        const reactWrap = document.createElement('div');
        reactWrap.className = 'reactions';
        Object.keys(reactions).forEach(emoji => {
          const uids = reactions[emoji] || [];
          if (uids.length === 0) return;
          const pill = document.createElement('span');
          pill.className = 'reactionPill' + (uids.includes(currentUser.uid) ? ' mine' : '');
          pill.textContent = `${emoji} ${uids.length}`;
          pill.onclick = (e) => { e.stopPropagation(); toggleReaction(cid, doc.id, emoji, uids.includes(currentUser.uid)); };
          reactWrap.appendChild(pill);
        });
        wrap.appendChild(reactWrap);

        // Эмодзи бар
        const bar = document.createElement('div');
        bar.className = 'emojiBar';
        REACTION_EMOJIS.forEach(emoji => {
          const sp = document.createElement('span');
          sp.textContent = emoji;
          sp.onclick = (e) => {
            e.stopPropagation();
            const already = ((m.reactions && m.reactions[emoji]) || []).includes(currentUser.uid);
            toggleReaction(cid, doc.id, emoji, already);
            bar.classList.remove('show');
          };
          bar.appendChild(sp);
        });
        wrap.appendChild(bar);

        box.appendChild(wrap);
      });
      box.scrollTop = box.scrollHeight;
    });

  function toggleEmojiBar(bar){
    document.querySelectorAll('.emojiBar.show').forEach(b => { if (b!==bar) b.classList.remove('show'); });
    bar.classList.toggle('show');
  }

  async function deleteMessage(cid, msgId) {
    if (confirm("Удалить сообщение?")) {
      await db.collection('chats').doc(cid).collection('messages').doc(msgId).delete();
    }
  }

  async function pinMessage(cid, msgData) {
    await db.collection('chats').doc(cid).set({ pinnedMsg: msgData }, { merge: true });
  }

  function startEditMessage(msgId, text) {
    editingMsgId = msgId;
    const input = document.getElementById('msgInput');
    input.value = text;
    input.focus();
  }

  async function toggleReaction(cid, msgId, emoji, alreadyReacted){
    const ref = db.collection('chats').doc(cid).collection('messages').doc(msgId);
    const fieldPath = `reactions.${emoji}`;
    await ref.update({
      [fieldPath]: alreadyReacted 
        ? firebase.firestore.FieldValue.arrayRemove(currentUser.uid)
        : firebase.firestore.FieldValue.arrayUnion(currentUser.uid)
    });
  }

  // Отправка и редактирование
  const send = async () => {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text && !pendingImage) return;
    
    if (editingMsgId) {
      await db.collection('chats').doc(cid).collection('messages').doc(editingMsgId).update({
        text: text,
        isEdited: true
      });
      editingMsgId = null;
      input.value = '';
      return;
    }

    input.value = '';
    const payload = {
      from: currentUser.uid, to: friend.uid,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    if (text) payload.text = text;
    if (pendingImage) payload.image = pendingImage;
    pendingImage = null;
    document.getElementById('imgPreviewBar').classList.remove('show');
    
    await db.collection('chats').doc(cid).collection('messages').add(payload);
    await db.collection('chats').doc(cid).set({ members: [currentUser.uid, friend.uid] }, { merge: true });
  };

  document.getElementById('sendBtn').onclick = send;
  const msgInput = document.getElementById('msgInput');
  msgInput.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
  
  // Передача набора текста
  msgInput.addEventListener('input', () => {
    db.collection('chats').doc(cid).set({
      typing: { [currentUser.uid]: firebase.firestore.FieldValue.serverTimestamp() }
    }, { merge: true });
  });

  // Запись голосовых сообщений
  const voiceBtn = document.getElementById('voiceBtn');
  voiceBtn.onclick = async () => {
    if (!isRecording) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        
        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.onstop = async () => {
          const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
          const reader = new FileReader();
          reader.readAsDataURL(audioBlob);
          reader.onloadend = async () => {
            const base64Audio = reader.result;
            await db.collection('chats').doc(cid).collection('messages').add({
              from: currentUser.uid,
              to: friend.uid,
              audio: base64Audio,
              createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
          };
        };

        mediaRecorder.start();
        isRecording = true;
        voiceBtn.classList.add('recActive');
      } catch (err) {
        alert('Не удалось получить доступ к микрофону');
      }
    } else {
      mediaRecorder.stop();
      isRecording = false;
      voiceBtn.classList.remove('recActive');
    }
  };

  document.getElementById('attachBtn').onclick = () => document.getElementById('imgFileInput').click();
  document.getElementById('imgCancelBtn').onclick = () => {
    pendingImage = null;
    document.getElementById('imgPreviewBar').classList.remove('show');
  };
}

document.getElementById('imgFileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  pendingImage = await resizeImage(file, 800, 0.6);
  document.getElementById('imgPreviewThumb').src = pendingImage;
  document.getElementById('imgPreviewBar').classList.add('show');
});

function resizeImage(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = () => {
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
          else { width = Math.round(width * maxDim / height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}
