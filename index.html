<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Мессенджер Deluxe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EDE6D3;
    --paper2: #E3DAC2;
    --ink: #1C1A16;
    --wire: #1B3A8C;
    --stamp: #B23A2E;
    --muted: #8A8272;
    --msg-me: #1B3A8C;
    --msg-me-text: #EDE6D3;
    --me-bg: #1C1A16;
    --me-text: #EDE6D3;
  }

  body.theme-dark {
    --paper: #18191C;
    --paper2: #222428;
    --ink: #E3E5E8;
    --wire: #4E6AD0;
    --stamp: #E54B4B;
    --muted: #8E9297;
    --msg-me: #3B519B;
    --msg-me-text: #FFFFFF;
    --me-bg: #2B2D31;
    --me-text: #E3E5E8;
  }
  body.theme-matrix {
    --paper: #0D1117;
    --paper2: #161B22;
    --ink: #00FF66;
    --wire: #008833;
    --stamp: #00FF66;
    --muted: #008833;
    --msg-me: #003311;
    --msg-me-text: #00FF66;
    --me-bg: #161B22;
    --me-text: #00FF66;
  }
  body.theme-cyber {
    --paper: #2B0938;
    --paper2: #3B0D4B;
    --ink: #00F0FF;
    --wire: #FF0055;
    --stamp: #FFE600;
    --muted: #A135B8;
    --msg-me: #FF0055;
    --msg-me-text: #FFFFFF;
    --me-bg: #3B0D4B;
    --me-text: #00F0FF;
  }
  body.theme-sunset {
    --paper: #2D1B2D;
    --paper2: #402440;
    --ink: #FFB3BA;
    --wire: #FF6767;
    --stamp: #FFAC41;
    --muted: #9C6B98;
    --msg-me: #6B2D5C;
    --msg-me-text: #FFB3BA;
    --me-bg: #402440;
    --me-text: #FFB3BA;
  }

  * { box-sizing: border-box; touch-action: manipulation; }
  body {
    margin: 0; font-family: 'JetBrains Mono', monospace;
    background: var(--paper);
    background-image: repeating-linear-gradient(0deg, rgba(0,0,0,.025) 0px, rgba(0,0,0,.025) 1px, transparent 1px, transparent 3px);
    color: var(--ink); height: 100vh; height: 100dvh; overflow: hidden;
    user-select: none;
  }
  h1, .tab { font-family: 'Special Elite', monospace; }
  #app { display: flex; height: 100vh; height: 100dvh; width: 100vw; overflow: hidden; }

  /* ---------- Auth ---------- */
  #authScreen {
    width: 100%; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 20% 20%, rgba(27,58,140,.06), transparent 40%), var(--paper);
  }
  .authBox {
    background: var(--paper2); padding: 24px; width: 340px; max-width: 90vw;
    border: 2px solid var(--ink); box-shadow: 7px 7px 0 var(--ink); position: relative;
  }
  .authBox::before {
    content: "№ 001 · PRIVATE WIRE"; position: absolute; top: -11px; left: 20px;
    background: var(--paper); padding: 0 8px; font-size: 10px; letter-spacing: 2px; color: var(--muted);
  }
  .authBox h1 { margin: 0 0 4px; font-size: 24px; letter-spacing: 1px; }
  .authBox p { color: var(--muted); font-size: 12px; margin: 0 0 20px; text-transform: uppercase; letter-spacing: 1px; }
  .authBox input {
    width: 100%; padding: 12px; margin-bottom: 10px; border: 2px solid var(--ink);
    background: var(--paper); color: var(--ink); font-size: 14px; font-family: 'JetBrains Mono', monospace;
  }
  .authBox input:focus { outline: 3px solid var(--wire); outline-offset: 1px; }
  .authBox button {
    width: 100%; padding: 12px; border: 2px solid var(--ink); background: var(--wire);
    color: var(--paper); font-size: 13px; font-weight: 700; letter-spacing: 1.5px;
    text-transform: uppercase; cursor: pointer; margin-top: 6px; box-shadow: 4px 4px 0 var(--ink); transition: transform .05s;
  }
  .authBox button:active { transform: translate(4px,4px); box-shadow: 0 0 0 var(--ink); }
  .authBox .switch { color: var(--muted); font-size: 12px; text-align: center; margin-top: 16px; cursor: pointer; }
  .authBox .switch b { color: var(--stamp); }
  .err { color: var(--stamp); font-size: 12px; margin-top: 6px; min-height: 16px; font-weight: 700; word-break: break-word; }

  /* ---------- Layout ---------- */
  #mainScreen { display: none; width: 100%; height: 100%; overflow: hidden; }
  #sidebar { width: 320px; min-width: 320px; max-width: 100%; background: var(--paper2); border-right: 2px solid var(--ink); display: flex; flex-direction: column; }
  
  #me { padding: 12px 14px; border-bottom: 2px solid var(--ink); display: flex; align-items: center; gap: 10px; background: var(--me-bg); color: var(--me-text); cursor: pointer; }
  #me .avatar { width: 36px; height: 36px; font-size: 14px; flex-shrink: 0; }
  #me .name { font-weight: 700; font-family: 'Special Elite', monospace; color: var(--me-text); letter-spacing: 1px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #logoutBtn { background: none; border: 1px solid var(--me-text); color: var(--me-text); cursor: pointer; font-size: 11px; padding: 5px 9px; text-transform: uppercase; letter-spacing: 1px; flex-shrink: 0; }

  .tabs { display: flex; border-bottom: 2px solid var(--ink); }
  .tab { flex: 1; text-align: center; padding: 10px 4px; font-size: 11px; color: var(--muted); cursor: pointer; text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; }
  .tab.active { color: var(--ink); background: var(--paper); border-bottom: 3px solid var(--stamp); margin-bottom: -2px; }

  #searchBox, #addFriendBox, #createGroupBar { padding: 8px 10px; border-bottom: 2px dashed var(--ink); display: flex; gap: 6px; }
  #searchBox input, #addFriendBox input { flex: 1; min-width: 0; padding: 8px 10px; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); font-size: 13px; font-family: 'JetBrains Mono', monospace; }
  #addFriendBox button, #createGroupBtn, #openGroupModalBtn { padding: 8px 10px; border: 2px solid var(--ink); background: var(--stamp); color: var(--paper); cursor: pointer; font-size: 11px; font-weight: 700; text-transform: uppercase; flex-shrink: 0; white-space: nowrap; }

  #list { flex: 1; overflow-y: auto; }
  .row { padding: 12px 14px; display: flex; align-items: center; gap: 10px; cursor: pointer; border-bottom: 1px dashed rgba(0,0,0,0.15); }
  .row:hover { background: var(--paper); }
  .row.active { background: var(--paper); box-shadow: inset 4px 0 0 var(--wire); }
  
  .avatar {
    width: 40px; height: 40px; background: var(--wire); color: var(--paper);
    border: 2px solid var(--ink); display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 16px; flex-shrink: 0; font-family: 'Special Elite', monospace;
    background-size: cover; background-position: center; border-radius: 4px; position: relative;
  }
  .onlineStatus { width: 10px; height: 10px; background: #2ecc71; border: 2px solid var(--ink); border-radius: 50%; position: absolute; bottom: -2px; right: -2px; }
  
  .rowInfo { flex: 1; min-width: 0; }
  .rowInfo .n { font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rowInfo .s { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: uppercase; letter-spacing: .5px; }
  .reqBtns { display: flex; gap: 4px; flex-shrink: 0; }
  .reqBtns button { border: 2px solid var(--ink); padding: 4px 8px; font-size: 12px; cursor: pointer; font-weight: 700; }
  .accept { background: var(--wire); color: var(--paper); }
  .decline { background: var(--paper); color: var(--ink); }
  .empty { padding: 20px; color: var(--muted); font-size: 12px; text-align: center; text-transform: uppercase; letter-spacing: 1px; }

  /* ---------- Chat ---------- */
  #chatArea { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--paper); }
  #chatHeader { padding: 10px 14px; border-bottom: 2px solid var(--ink); font-weight: 700; display: flex; align-items: center; justify-content: space-between; background: var(--paper2); letter-spacing: .5px; gap: 8px; }
  .hdrMain { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
  #chatHeader .sub { font-size: 11px; color: var(--stamp); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; min-height: 14px; display: flex; align-items: center; gap: 4px; }
  #chatHeader .hdrText { display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
  #chatHeader .hdrText > div:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  
  #chatSearchPanel { display: none; padding: 8px 12px; background: var(--paper2); border-bottom: 2px dashed var(--ink); gap: 6px; }
  #chatSearchPanel.show { display: flex; }
  #chatSearchPanel input { flex: 1; min-width: 0; padding: 6px 10px; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); font-family: 'JetBrains Mono', monospace; font-size: 13px; }
  #chatSearchPanel button { border: 2px solid var(--ink); background: var(--paper); cursor: pointer; padding: 4px 8px; flex-shrink: 0; }

  #pinnedBar { padding: 8px 12px; background: var(--paper2); border-bottom: 2px dashed var(--ink); font-size: 12px; display: none; justify-content: space-between; align-items: center; cursor: pointer; gap: 8px; }
  #pinnedBar.show { display: flex; }
  #pinnedBar .pinText { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  #pinnedBar button { border: 1px solid var(--ink); background: var(--paper); cursor: pointer; font-size: 10px; padding: 2px 6px; flex-shrink: 0; }

  #noChatSelected { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: 2px; text-align: center; padding: 20px; }
  #messages { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
  
  .msgWrap { display: flex; flex-direction: column; max-width: 78%; }
  .msgWrap.me { align-self: flex-end; align-items: flex-end; }
  .msgWrap.other { align-self: flex-start; align-items: flex-start; }
  .msg { padding: 8px 12px; font-size: 13px; line-height: 1.4; word-break: break-word; border: 2px solid var(--ink); position: relative; cursor: pointer; max-width: 100%; user-select: text; transition: background 0.3s, border-color 0.3s; }
  .msg.highlight { border-color: var(--stamp) !important; box-shadow: 0 0 10px var(--stamp); }
  .msg.me { background: var(--msg-me); color: var(--msg-me-text); box-shadow: 3px 3px 0 var(--ink); }
  .msg.other { background: var(--paper2); color: var(--ink); box-shadow: -3px 3px 0 var(--ink); }
  .msg img { max-width: 100%; max-height: 220px; display: block; border: 1px solid var(--ink); margin-bottom: 6px; border-radius: 2px; cursor: zoom-in; object-fit: contain; }
  .msg audio { max-width: 100%; margin-bottom: 4px; }
  .msg .t { font-size: 10px; opacity: .75; margin-top: 4px; display: flex; justify-content: flex-end; align-items: center; gap: 4px; text-transform: uppercase; letter-spacing: 1px; }
  .msg .ticks { font-weight: bold; font-size: 11px; }
  
  .replyQuote { background: rgba(0,0,0,0.12); border-left: 3px solid var(--stamp); padding: 4px 6px; margin-bottom: 6px; font-size: 11px; border-radius: 2px; word-break: break-word; }

  .msgActions { display: none; position: absolute; top: -14px; right: 4px; background: var(--paper2); border: 1px solid var(--ink); gap: 2px; z-index: 10; padding: 2px; box-shadow: 2px 2px 0 var(--ink); }
  .msg:hover .msgActions, .msg:active .msgActions { display: flex; }
  .msgActions button { background: var(--paper); border: 1px solid var(--ink); color: var(--ink); font-size: 10px; cursor: pointer; padding: 2px 4px; }

  .reactions { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
  .reactionPill { background: var(--paper2); border: 1px solid var(--ink); border-radius: 10px; padding: 1px 6px; font-size: 11px; cursor: pointer; color: var(--ink); }
  .reactionPill.mine { background: var(--wire); color: var(--paper); }
  .emojiBar { display: none; gap: 6px; background: var(--paper2); border: 2px solid var(--ink); padding: 4px 8px; box-shadow: 3px 3px 0 var(--ink); margin-top: 4px; }
  .emojiBar.show { display: flex; }
  .emojiBar span { cursor: pointer; font-size: 16px; transition: transform 0.1s; }
  .emojiBar span:hover { transform: scale(1.2); }

  #replyBar { display: none; padding: 6px 12px; background: var(--paper2); border-top: 2px dashed var(--ink); justify-content: space-between; align-items: center; font-size: 12px; gap: 8px; }
  #replyBar.show { display: flex; }
  #replyTextPreview { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }

  #inputBar { padding: 8px 10px; border-top: 2px solid var(--ink); display: flex; gap: 6px; background: var(--paper2); align-items: center; }
  #inputBar input[type=text] { flex: 1; min-width: 0; padding: 10px 12px; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); font-size: 13px; font-family: 'JetBrains Mono', monospace; }
  #inputBar button { padding: 0 14px; height: 40px; border: 2px solid var(--ink); background: var(--stamp); color: var(--paper); font-weight: 700; cursor: pointer; box-shadow: 2px 2px 0 var(--ink); flex-shrink: 0; }
  #inputBar button:active { transform: translate(2px,2px); box-shadow: 0 0 0 var(--ink); }
  #inputBar .iconBtn { background: var(--paper); color: var(--ink); padding: 0 10px; font-size: 15px; }
  #inputBar .recActive { background: #e74c3c !important; color: white !important; animation: pulse 1s infinite; }

  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

  #imgPreviewBar { display: none; padding: 6px 12px; background: var(--paper2); border-top: 2px dashed var(--ink); align-items: center; gap: 8px; }
  #imgPreviewBar.show { display: flex; }
  #imgPreviewBar img { max-height: 48px; border: 1px solid var(--ink); }
  #imgPreviewBar button { border: 2px solid var(--ink); background: var(--stamp); color: var(--paper); padding: 4px 8px; cursor: pointer; font-size: 10px; text-transform: uppercase; }

  .typingDots span { animation: blink 1.4s infinite repeating-linear-gradient; font-weight: bold; }
  .typingDots span:nth-child(2) { animation-delay: .2s; }
  .typingDots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0% { opacity: .2; } 20% { opacity: 1; } 100% { opacity: .2; } }

  #lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; align-items: center; justify-content: center; backdrop-filter: blur(4px); padding: 16px; }
  #lightbox.show { display: flex; }
  #lightbox img { max-width: 100%; max-height: 90vh; border: 3px solid var(--paper); box-shadow: 0 0 20px rgba(0,0,0,0.5); object-fit: contain; }
  #lightboxClose { position: absolute; top: 16px; right: 20px; color: #fff; font-size: 32px; cursor: pointer; font-weight: bold; line-height: 1; }

  #backBtn { display: none; background: none; border: 2px solid var(--ink); color: var(--ink); font-size: 14px; font-weight: bold; cursor: pointer; padding: 2px 8px; margin-right: 2px; flex-shrink: 0; }

  @media (max-width: 720px) {
    #sidebar { width: 100%; min-width: 100%; border-right: none; }
    #chatArea { display: none; width: 100%; }
    body.chatOpen #sidebar { display: none; }
    body.chatOpen #chatArea { display: flex; }
    #backBtn { display: inline-block !important; }
    .msgWrap { max-width: 88%; }
    #inputBar { padding: 6px; gap: 4px; }
    #inputBar input[type=text] { padding: 8px 10px; font-size: 13px; }
    #inputBar button { padding: 0 10px; height: 36px; font-size: 12px; }
    #inputBar .iconBtn { padding: 0 8px; font-size: 14px; }
  }

  .modalOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 50; align-items: center; justify-content: center; backdrop-filter: blur(2px); padding: 12px; }
  .modalOverlay.show { display: flex; }
  .modalBox { background: var(--paper2); border: 2px solid var(--ink); box-shadow: 7px 7px 0 var(--ink); padding: 20px; width: 380px; max-width: 100%; max-height: 90vh; overflow-y: auto; position: relative; }
  .modalBox h2 { margin: 0 0 14px; font-size: 18px; font-family: 'Special Elite', monospace; }
  .modalBox label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 4px; margin-top: 10px; }
  .modalBox input, .modalBox select { width: 100%; padding: 8px 10px; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); font-size: 13px; font-family: 'JetBrains Mono', monospace; }
  .colorRow { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
  .colorDot { width: 26px; height: 26px; border: 2px solid var(--ink); cursor: pointer; border-radius: 50%; }
  .colorDot.picked { outline: 3px solid var(--stamp); outline-offset: 2px; }
  .modalBox .row2 { display: flex; gap: 8px; margin-top: 16px; }
  .modalBox .row2 button { flex: 1; padding: 10px; border: 2px solid var(--ink); cursor: pointer; font-weight: 700; text-transform: uppercase; font-size: 11px; box-shadow: 3px 3px 0 var(--ink); }
  .modalBox .save { background: var(--wire); color: var(--paper); }
  .modalBox .close { background: var(--paper); color: var(--ink); }
  .modalErr { color: var(--stamp); font-size: 11px; margin-top: 8px; min-height: 14px; font-weight: 700; word-break: break-word; }
  
  .avatarUpload { display: flex; align-items: center; gap: 10px; margin-top: 6px; flex-wrap: wrap; }
  .avatarUpload button { padding: 6px 10px; border: 2px solid var(--ink); background: var(--paper); cursor: pointer; font-size: 10px; text-transform: uppercase; font-weight: bold; }
  .memberCheckList { max-height: 120px; overflow-y: auto; border: 2px solid var(--ink); background: var(--paper); padding: 6px; margin-top: 6px; }
  .memberCheckItem { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 12px; }
  .memberCheckItem input { width: auto; }
</style>
</head>
<body>

<div id="app">
  <!-- AUTH -->
  <div id="authScreen">
    <div class="authBox">
      <h1 id="authTitle">Вход</h1>
      <p id="authSubtitle">Войдите, чтобы продолжить</p>
      <input id="usernameInput" placeholder="Юзернейм (для регистрации)" style="display:none;">
      <input id="emailInput" placeholder="Email" type="email">
      <input id="passInput" placeholder="Пароль" type="password">
      <button id="authSubmitBtn">Войти</button>
      <div class="err" id="authErr"></div>
      <div class="switch" id="authSwitch">Нет аккаунта? <b>Зарегистрироваться</b></div>
    </div>
  </div>

  <!-- MAIN -->
  <div id="mainScreen">
    <div id="sidebar">
      <div id="me">
        <div class="avatar" id="myAvatar">?</div>
        <div class="name" id="myName">...</div>
        <button id="logoutBtn">Выйти</button>
      </div>
      <div id="addFriendBox">
        <input id="friendInput" placeholder="Юзернейм друга">
        <button id="addFriendBtn">Добавить</button>
      </div>
      <div id="createGroupBar" style="display:none;">
        <button id="openGroupModalBtn" style="width:100%;">+ Создать группу/канал</button>
      </div>
      <div id="searchBox">
        <input id="searchInput" placeholder="🔍 Поиск...">
      </div>
      <div class="tabs">
        <div class="tab active" data-tab="chats">Чаты</div>
        <div class="tab" data-tab="groups">Группы</div>
        <div class="tab" data-tab="requests">Заявки <span id="reqBadge"></span></div>
      </div>
      <div id="list"></div>
    </div>
    <div id="chatArea">
      <div id="noChatSelected">Выберите чат или канал слева</div>
    </div>
  </div>
</div>

<div id="lightbox">
  <span id="lightboxClose">&times;</span>
  <img id="lightboxImg" src="" alt="Увеличенное изображение">
</div>

<div class="modalOverlay" id="groupModal">
  <div class="modalBox">
    <h2>Создание группы/канала</h2>
    <label>Тип</label>
    <select id="groupTypeSelect">
      <option value="group">👥 Группа (все могут писать)</option>
      <option value="channel">📢 Канал (пишет только админ)</option>
    </select>
    <label>Название</label>
    <input id="groupNameInput" placeholder="Название...">
    <label>Участники (Из списка друзей)</label>
    <div class="memberCheckList" id="groupMemberList"></div>
    <div class="modalErr" id="groupErr"></div>
    <div class="row2">
      <button class="close" id="groupCloseBtn">Отмена</button>
      <button class="save" id="groupCreateSaveBtn">Создать</button>
    </div>
  </div>
</div>

<div class="modalOverlay" id="profileModal">
  <div class="modalBox">
    <h2>Настройки профиля</h2>
    <label>Аватарка</label>
    <div class="avatarUpload">
      <div class="avatar" id="editAvatarPreview">?</div>
      <button id="uploadAvatarBtn">Загрузить фото</button>
      <button id="removeAvatarBtn">Сбросить</button>
    </div>
    <label>Юзернейм</label>
    <input id="editUsername" maxlength="20">
    <label>Цвет профиля (если нет фото)</label>
    <div class="colorRow" id="colorRow"></div>
    <label>Цвет обводки и акцента</label>
    <div class="colorRow" id="borderColorRow"></div>
    <label>Тема оформления</label>
    <select id="themeSelect">
      <option value="paper">📜 Бумага (Paper)</option>
      <option value="dark">🌙 Ночная (Noir)</option>
      <option value="matrix">🟢 Матрица (Terminal)</option>
      <option value="cyber">👾 Киберпанк (Neon)</option>
      <option value="sunset">🌅 Закат (Sunset Neon)</option>
    </select>
    <div class="modalErr" id="profileErr"></div>
    <div class="row2">
      <button class="close" id="profileCloseBtn">Отмена</button>
      <button class="save" id="profileSaveBtn">Сохранить</button>

/* ---------------- AUTH UI ---------------- */
const authTitle = document.getElementById('authTitle');
const authSubtitle = document.getElementById('authSubtitle');
const usernameInput = document.getElementById('usernameInput');
const emailInput = document.getElementById('emailInput');
const passInput = document.getElementById('passInput');
const authErr = document.getElementById('authErr');
const authSwitch = document.getElementById('authSwitch');
const authSubmitBtn = document.getElementById('authSubmitBtn');

authSwitch.onclick = () => {
  isLogin = !isLogin;
  authTitle.textContent = isLogin ? 'Вход' : 'Регистрация';
  authSubtitle.textContent = isLogin ? 'Войдите, чтобы продолжить' : 'Придумайте данные для входа';
  usernameInput.style.display = isLogin ? 'none' : 'block';
  authSubmitBtn.textContent = isLogin ? 'Войти' : 'Зарегистрироваться';
  authSwitch.innerHTML = isLogin ? 'Нет аккаунта? <b>Зарегистрироваться</b>' : 'Уже есть аккаунт? <b>Войти</b>';
  authErr.textContent = '';
};

authSubmitBtn.onclick = async () => {
  authErr.textContent = '';
  const email = emailInput.value.trim();
  const pass = passInput.value;
  if (!email || !pass) { authErr.textContent = 'Заполните email и пароль'; return; }

  const originalText = authSubmitBtn.textContent;
  authSubmitBtn.disabled = true;

  try {
    if (isLogin) {
      await auth.signInWithEmailAndPassword(email, pass);
    } else {
      const username = usernameInput.value.trim().toLowerCase();
      if (!/^[a-z0-9_]{3,20}$/.test(username)) {
        authErr.textContent = 'Юзернейм: 3-20 символов, латиница/цифры/_';
        return;
      }
      const taken = await db.collection('usernames').doc(username).get();
      if (taken.exists) { authErr.textContent = 'Этот юзернейм уже занят'; return; }

      isRegistering = true;
      const color = AVATAR_COLORS[Math.floor(Math.random()*AVATAR_COLORS.length)];
      const cred = await auth.createUserWithEmailAndPassword(email, pass);
      const uid = cred.user.uid;

      // СОБЛЮДЕНИЕ ПРАВИЛ: Сохраняем uid создателя
      await db.collection('usernames').doc(username).set({ uid: uid });
      await db.collection('users').doc(uid).set({
        username, email, color, photo: null, theme: 'paper', borderColor: BORDER_COLORS[0],
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      isRegistering = false;
      await enterApp(cred.user, username, color, null, 'paper', BORDER_COLORS[0]);
    }
  } catch (e) {
    authErr.textContent = translateError(e.code) || e.message;
  } finally {
    isRegistering = false;
    authSubmitBtn.disabled = false;
    authSubmitBtn.textContent = originalText;
  }
};

function translateError(code){
  const map = {
    'auth/email-already-in-use': 'Этот email уже используется',
    'auth/invalid-email': 'Некорректный email',
    'auth/weak-password': 'Пароль слишком простой (мин. 6 символов)',
    'auth/user-not-found': 'Пользователь не найден',
    'auth/wrong-password': 'Неверный пароль'
  };
  return map[code];
}

document.getElementById('logoutBtn').onclick = () => auth.signOut();

async function enterApp(user, username, color, photo, theme, borderColor){
  currentUser = user;
  myUsername = username;
  myColor = color || AVATAR_COLORS[0];
  myBorderColor = borderColor || BORDER_COLORS[0];
  myPhoto = photo || null;
  myTheme = theme || 'paper';
  
  applyTheme(myTheme, myBorderColor);
  
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('mainScreen').style.display = 'flex';
  document.getElementById('myName').textContent = '@' + myUsername;
  
  renderAvatar(document.getElementById('myAvatar'), myUsername, myColor, myPhoto);
  
  updateUserPresence();
  listenFriends();
  listenRequests();
  listenGroups();
}

function updateUserPresence() {
  if (!currentUser) return;
  const userRef = db.collection('users').doc(currentUser.uid);
  userRef.update({ lastOnline: firebase.firestore.FieldValue.serverTimestamp() });
  setInterval(() => {
    if (currentUser) userRef.update({ lastOnline: firebase.firestore.FieldValue.serverTimestamp() });
  }, 15000);
}

function applyTheme(theme, borderColor) {
  document.body.className = '';
  if (theme && theme !== 'paper') {
    document.body.classList.add('theme-' + theme);
  }
  if (borderColor) {
    document.documentElement.style.setProperty('--ink', borderColor);
  }
}

function renderAvatar(el, username, color, photo, isOnline = false) {
  if (!el) return;
  if (photo) {
    el.style.backgroundImage = `url(${photo})`;
    el.textContent = '';
  } else {
    el.style.backgroundImage = 'none';
    el.style.background = color || '#1B3A8C';
    el.textContent = username ? username[0].toUpperCase() : '?';
  }
  let dot = el.querySelector('.onlineStatus');
  if (isOnline) {
    if (!dot) {
      dot = document.createElement('div');
      dot.className = 'onlineStatus';
      el.appendChild(dot);
    }
  } else if (dot) {
    dot.remove();
  }
}

auth.onAuthStateChanged(async (user) => {
  if (user) {
    if (isRegistering) return;
    currentUser = user;
    const doc = await db.collection('users').doc(user.uid).get();
    if (!doc.exists) {
      auth.signOut();
      return;
    }
    const d = doc.data();
    await enterApp(user, d.username, d.color, d.photo, d.theme, d.borderColor);
  } else {
    currentUser = null; myUsername = null;
    if (unsubFriendsA) unsubFriendsA();
    if (unsubFriendsB) unsubFriendsB();
    if (unsubRequests) unsubRequests();
    if (unsubMessages) unsubMessages();
    if (unsubChatMeta) unsubChatMeta();
    if (unsubGroups) unsubGroups();
    document.getElementById('authScreen').style.display = 'flex';
    document.getElementById('mainScreen').style.display = 'none';
  }
});

/* ---------------- ПРОФИЛЬ ---------------- */
const profileModal = document.getElementById('profileModal');
const colorRow = document.getElementById('colorRow');
const borderColorRow = document.getElementById('borderColorRow');
let pickedColor = myColor;
let pickedBorderColor = myBorderColor;

AVATAR_COLORS.forEach(c => {
  const dot = document.createElement('div');
  dot.className = 'colorDot';
  dot.style.background = c;
  dot.onclick = () => {
    pickedColor = c;
    colorRow.querySelectorAll('.colorDot').forEach(d=>d.classList.remove('picked'));
    dot.classList.add('picked');
  };
  colorRow.appendChild(dot);
});

BORDER_COLORS.forEach(c => {
  const dot = document.createElement('div');
  dot.className = 'colorDot';
  dot.style.background = c;
  dot.onclick = () => {
    pickedBorderColor = c;
    borderColorRow.querySelectorAll('.colorDot').forEach(d=>d.classList.remove('picked'));
    dot.classList.add('picked');
  };
  borderColorRow.appendChild(dot);
});

document.getElementById('me').onclick = () => {
  document.getElementById('editUsername').value = myUsername;
  document.getElementById('themeSelect').value = myTheme || 'paper';
  pickedColor = myColor;
  pickedBorderColor = myBorderColor;
  customAvatarData = myPhoto;
  
  renderAvatar(document.getElementById('editAvatarPreview'), myUsername, pickedColor, customAvatarData);
  colorRow.querySelectorAll('.colorDot').forEach(d => d.classList.toggle('picked', d.style.background === myColor));
  borderColorRow.querySelectorAll('.colorDot').forEach(d => d.classList.toggle('picked', d.style.background === myBorderColor));
  document.getElementById('profileErr').textContent = '';
  profileModal.classList.add('show');
};

document.getElementById('uploadAvatarBtn').onclick = () => document.getElementById('avatarFileInput').click();

document.getElementById('profileCloseBtn').onclick = () => profileModal.classList.remove('show');

document.getElementById('profileSaveBtn').onclick = async () => {
  const errEl = document.getElementById('profileErr');
  errEl.textContent = '';
  const newUsername = document.getElementById('editUsername').value.trim().toLowerCase();
  const selectedTheme = document.getElementById('themeSelect').value;

  if (!/^[a-z0-9_]{3,20}$/.test(newUsername)) {
    errEl.textContent = 'Юзернейм: 3-20 символов, латиница/цифры/_';
    return;
  }
  try {
    if (newUsername !== myUsername) {
      const taken = await db.collection('usernames').doc(newUsername).get();
      if (taken.exists) { errEl.textContent = 'Этот юзернейм уже занят'; return; }
      await db.collection('usernames').doc(newUsername).set({ uid: currentUser.uid });
      await db.collection('usernames').doc(myUsername).delete();
    }
    
    await db.collection('users').doc(currentUser.uid).update({
      username: newUsername,
      color: pickedColor,
      borderColor: pickedBorderColor,
      photo: customAvatarData,
      theme: selectedTheme
    });

    myUsername = newUsername; myColor = pickedColor; myBorderColor = pickedBorderColor; myPhoto = customAvatarData; myTheme = selectedTheme;
    applyTheme(myTheme, myBorderColor);

    document.getElementById('myName').textContent = '@' + myUsername;
    renderAvatar(document.getElementById('myAvatar'), myUsername, myColor, myPhoto);

    profileModal.classList.remove('show');
  } catch (e) {
    errEl.textContent = e.message || 'Ошибка сохранения';
  }
};

document.getElementById('addFriendBtn').onclick = async () => {
  const input = document.getElementById('friendInput');
  const target = input.value.trim().toLowerCase();
  if (!target || target === myUsername) return;

  if (myFriends.some(f => f.username.toLowerCase() === target)) {
    alert('Этот пользователь уже у вас в друзьях!');
    return;
  }

  const targetDoc = await db.collection('usernames').doc(target).get();
  if (!targetDoc.exists) { alert('Пользователь не найден'); return; }

  const targetUid = targetDoc.data().uid;
  const reqId = `${currentUser.uid}_${targetUid}`;

  const existing = await db.collection('friendRequests').doc(reqId).get();
  if (existing.exists && existing.data().status === 'pending') {
    alert('Заявка уже отправлена и ожидает ответа!');
    return;
  }

  // СОБЛЮДЕНИЕ ПРАВИЛ: Добавляем senderId и receiverId
  await db.collection('friendRequests').doc(reqId).set({
    senderId: currentUser.uid,
    receiverId: targetUid,
    from: currentUser.uid, 
    fromUsername: myUsername,
    to: targetUid, 
    toUsername: target, 
    status: 'pending',
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  input.value = '';
  alert('Заявка отправлена!');
};

document.getElementById('searchInput').oninput = (e) => {

/* ---------------- ЗАЯВКИ И СПИСОК ---------------- */
function listenRequests(){
  unsubRequests = db.collection('friendRequests')
    .where('receiverId', '==', currentUser.uid)
    .where('status', '==', 'pending')
    .onSnapshot(snap => {
      incomingRequests = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      document.getElementById('reqBadge').textContent = incomingRequests.length ? `(${incomingRequests.length})` : '';
      if (activeTab === 'requests') renderList();
    });
}

function listenGroups(){
  unsubGroups = db.collection('groups')
    .where('members', 'array-contains', currentUser.uid)
    .onSnapshot(snap => {
      myGroups = snap.docs.map(d => ({ id: d.id, ...d.data(), isGroup: true }));
      if (activeTab === 'groups') renderList();
    });
}

async function acceptRequest(req){
  await db.collection('friendRequests').doc(req.id).update({ status: 'accepted' });
}
async function declineRequest(req){
  await db.collection('friendRequests').doc(req.id).update({ status: 'declined' });
}

async function rebuildFriendsList(){
  const map = new Map();
  friendsAccepted.asFrom.forEach(r => map.set(r.to || r.receiverId, r.toUsername));
  friendsAccepted.asTo.forEach(r => map.set(r.from || r.senderId, r.fromUsername));
  const uids = [...map.keys()];
  if (uids.length === 0) { myFriends = []; if (activeTab==='chats') renderList(); return; }
  const docs = await Promise.all(uids.map(uid => db.collection('users').doc(uid).get()));
  myFriends = docs.filter(d=>d.exists).map(d => ({ uid: d.id, ...d.data() }));
  if (activeTab === 'chats') renderList();
}

function listenFriends(){
  unsubFriendsA = db.collection('friendRequests')
    .where('senderId','==',currentUser.uid).where('status','==','accepted')
    .onSnapshot(snap => { friendsAccepted.asFrom = snap.docs.map(d=>d.data()); rebuildFriendsList(); });
  unsubFriendsB = db.collection('friendRequests')
    .where('receiverId','==',currentUser.uid).where('status','==','accepted')
    .onSnapshot(snap => { friendsAccepted.asTo = snap.docs.map(d=>d.data()); rebuildFriendsList(); });
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    activeTab = tab.dataset.tab;

    document.getElementById('addFriendBox').style.display = activeTab === 'chats' ? 'flex' : 'none';
    document.getElementById('createGroupBar').style.display = activeTab === 'groups' ? 'flex' : 'none';

    renderList();
  };
});

function renderList(filter = ''){
  const list = document.getElementById('list');
  list.innerHTML = '';
  
  if (activeTab === 'chats') {
    const filtered = myFriends.filter(f => f.username.toLowerCase().includes(filter));
    if (filtered.length === 0) {
      list.innerHTML = '<div class="empty">Чаты не найдены</div>';
      return;
    }
    filtered.forEach(f => {
      const row = document.createElement('div');
      row.className = 'row' + (activeChatWith && activeChatWith.uid === f.uid ? ' active' : '');
      const avContainer = document.createElement('div');
      avContainer.className = 'avatar';
      
      const isOnline = f.lastOnline && (Date.now() - f.lastOnline.toMillis() < 45000);
      renderAvatar(avContainer, f.username, f.color, f.photo, isOnline);

      row.appendChild(avContainer);
      row.innerHTML += `<div class="rowInfo"><div class="n">@${f.username}</div><div class="s">${isOnline ? 'В сети' : formatLastOnline(f.lastOnline)}</div></div>`;
      row.onclick = () => openChat(f);
      list.appendChild(row);
    });
  } else if (activeTab === 'groups') {
    const filtered = myGroups.filter(g => g.name.toLowerCase().includes(filter));
    if (filtered.length === 0) {
      list.innerHTML = '<div class="empty">Группы и каналы не найдены</div>';
      return;
    }
    filtered.forEach(g => {
      const row = document.createElement('div');
      row.className = 'row' + (activeChatWith && activeChatWith.id === g.id ? ' active' : '');
      const avContainer = document.createElement('div');
      avContainer.className = 'avatar';
      avContainer.textContent = g.type === 'channel' ? '📢' : '👥';

      row.appendChild(avContainer);
      row.innerHTML += `<div class="rowInfo"><div class="n">${escapeHtml(g.name)}</div><div class="s">${g.type === 'channel' ? 'Канал' : 'Группа'} • ${g.members ? g.members.length : 1} участн.</div></div>`;
      row.onclick = () => openGroupChat(g);
      list.appendChild(row);
    });
  } else {
    if (incomingRequests.length === 0) {
      list.innerHTML = '<div class="empty">Нет заявок</div>';
      return;
    }
    incomingRequests.forEach(r => {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `
        <div class="avatar">${r.fromUsername[0].toUpperCase()}</div>
        <div class="rowInfo"><div class="n">@${r.fromUsername}</div><div class="s">Хочет дружить</div></div>
        <div class="reqBtns">
          <button class="accept">✓</button>
          <button class="decline">✕</button>
        </div>
      `;
      row.querySelector('.accept').onclick = (e) => { e.stopPropagation(); acceptRequest(r); };
      row.querySelector('.decline').onclick = (e) => { e.stopPropagation(); declineRequest(r); };
      list.appendChild(row);
    });
  }
}

function formatLastOnline(ts) {
  if (!ts) return 'Офлайн';
  const d = ts.toDate();
  return 'Был(а) ' + d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

document.getElementById('groupCreateSaveBtn').onclick = async () => {
  const name = document.getElementById('groupNameInput').value.trim();
  const type = document.getElementById('groupTypeSelect').value;
  if (!name) { document.getElementById('groupErr').textContent = 'Введите название'; return; }

  const checked = Array.from(document.querySelectorAll('#groupMemberList input:checked')).map(i => i.value);
  if (!checked.includes(currentUser.uid)) {
    checked.push(currentUser.uid);
  }

  try {
    // СОБЛЮДЕНИЕ ПРАВИЛ: Передаем owner и members
    await db.collection('groups').add({
      name: name,
      type: type,
      owner: currentUser.uid,
      members: checked,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    groupModal.classList.remove('show');
  } catch (err) {
    document.getElementById('groupErr').textContent = 'Ошибка: ' + err.message;
  }
};

/* ---------------- ЧАТ И ИНДИКАТОР ПЕЧАТИ ---------------- */
const REACTION_EMOJIS = ['👍','❤️','😂','😮','🔥'];
function chatIdFor(uidA, uidB){ return [uidA, uidB].sort().join('_'); }

async function openChat(friend){
  activeChatWith = friend;
  const cid = chatIdFor(currentUser.uid, friend.uid);
  
  // СОБЛЮДЕНИЕ ПРАВИЛ: Гарантируем наличие участников в чате
  await db.collection('chats').doc(cid).set({
    participants: [currentUser.uid, friend.uid]
  }, { merge: true });

  setupChatLayout(friend.username, false, friend);
}

function openGroupChat(group){
  activeChatWith = group;
  setupChatLayout(group.name, true, group);
}

function setupChatLayout(titleText, isGroup = false, targetObj = null) {
  editingMsgId = null;
  replyingToMsg = null;
  document.body.classList.add('chatOpen');
  renderList();

  const chatArea = document.getElementById('chatArea');
  const cid = isGroup ? targetObj.id : chatIdFor(currentUser.uid, targetObj.uid);
  const collectionRef = isGroup ? db.collection('groups').doc(cid).collection('messages') : db.collection('chats').doc(cid).collection('messages');

  const canWrite = !isGroup || targetObj.type !== 'channel' || targetObj.owner === currentUser.uid;

  chatArea.innerHTML = `
    <div id="chatHeader">
      <div class="hdrMain">
        <button id="backBtn">←</button>
        <div class="avatar" id="hdrAvatar"></div>
        <div class="hdrText">
          <div>${isGroup ? escapeHtml(titleText) : '@' + titleText}</div>
          <div class="sub" id="typingIndicator"></div>
        </div>
      </div>
      <div>
        <button id="searchMsgToggleBtn" style="border:2px solid var(--ink); background:var(--paper); cursor:pointer; padding:4px 8px;">🔍</button>
      </div>
    </div>
    <div id="chatSearchPanel">
      <input id="chatSearchInput" placeholder="Поиск в чате...">
      <button id="chatSearchClose">✕</button>
    </div>
    <div id="pinnedBar">
      <div class="pinText" id="pinnedContent">Закрепленное сообщение</div>
      <button id="unpinBtn">Открепить</button>
    </div>
    <div id="messages"></div>
    <div id="replyBar">
      <span id="replyTextPreview">Ответ на сообщение...</span>
      <button id="replyCancelBtn" style="border:1px solid var(--ink); background:var(--paper); cursor:pointer;">✕</button>
    </div>
    <div id="imgPreviewBar"><img id="imgPreviewThumb"><span>Картинка готова</span><button id="imgCancelBtn">Убрать</button></div>
    ${canWrite ? `
    <div id="inputBar">
      <button class="iconBtn" id="attachBtn" title="Фото">📎</button>
      <button class="iconBtn" id="voiceBtn" title="Голосовое сообщение">🎙️</button>
      <input id="msgInput" type="text" placeholder="Сообщение...">
      <button id="sendBtn">➤</button>
    </div>` : `<div style="padding:15px; text-align:center; color:var(--muted); background:var(--paper2); border-top:2px solid var(--ink); font-size:12px;">Только администратор может отправлять сообщения в этот канал.</div>`}
  `;

  if (!isGroup) {
    renderAvatar(document.getElementById('hdrAvatar'), targetObj.username, targetObj.color, targetObj.photo);
  } else {
    const av = document.getElementById('hdrAvatar');
    if (av) av.textContent = targetObj.type === 'channel' ? '📢' : '👥';
  }

  document.getElementById('backBtn').onclick = () => document.body.classList.remove('chatOpen');

  const searchBtn = document.getElementById('searchMsgToggleBtn');
  const searchPanel = document.getElementById('chatSearchPanel');
  searchBtn.onclick = () => searchPanel.classList.toggle('show');
  document.getElementById('chatSearchClose').onclick = () => {
    searchPanel.classList.remove('show');
    document.getElementById('chatSearchInput').value = '';
    renderMessages(currentSnapshotDocs);
  };
  document.getElementById('chatSearchInput').oninput = (e) => {
    const val = e.target.value.toLowerCase();
    renderMessages(currentSnapshotDocs, val);
  };

  const metaDocRef = isGroup ? db.collection('groups').doc(cid) : db.collection('chats').doc(cid);
  if (unsubChatMeta) unsubChatMeta();
  unsubChatMeta = metaDocRef.onSnapshot(doc => {
    if (!doc.exists) return;
    const data = doc.data();
    const ind = document.getElementById('typingIndicator');
    const pinnedBar = document.getElementById('pinnedBar');
    const pinnedContent = document.getElementById('pinnedContent');

    if (!isGroup) {
      const t = data.typing || {};
      const otherTs = t[targetObj.uid];
      if (ind) {
        if (otherTs && (Date.now() - otherTs.toMillis()) < 3500) {
          ind.innerHTML = `печатает<span class="typingDots"><span>.</span><span>.</span><span>.</span></span>`;
        } else {
          ind.textContent = '';
        }
      }
    }

    if (data.pinnedMsg) {
      pinnedBar.classList.add('show');
      pinnedContent.textContent = "📌 " + (data.pinnedMsg.text || (data.pinnedMsg.audio ? "Голосовое сообщение" : "Изображение"));
      pinnedBar.onclick = () => {
        if (data.pinnedMsg.id) {
          const el = document.getElementById('msg_' + data.pinnedMsg.id);
          if (el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            el.classList.add('highlight');
            setTimeout(() => el.classList.remove('highlight'), 2000);
          }
        }
      };
      document.getElementById('unpinBtn').onclick = (e) => {
        e.stopPropagation();
        metaDocRef.update({ pinnedMsg: firebase.firestore.FieldValue.delete() });
      };
    } else {
      pinnedBar.classList.remove('show');
    }
  });

  let currentSnapshotDocs = [];
  if (unsubMessages) unsubMessages();
  unsubMessages = collectionRef.orderBy('createdAt', 'asc').onSnapshot(snap => {
    currentSnapshotDocs = snap.docs;
    renderMessages(currentSnapshotDocs);

    snap.docs.forEach(d => {
      const m = d.data();
      const sender = m.senderId || m.from;
      if (sender !== currentUser.uid && !m.read) {
        d.ref.update({ read: true });
      }
    });
  });

  function renderMessages(docs, filterText = '') {
    const box = document.getElementById('messages');
    if (!box) return;
    box.innerHTML = '';

    docs.forEach(doc => {
      const m = doc.data();
      if (filterText && m.text && !m.text.toLowerCase().includes(filterText)) return;

      const sender = m.senderId || m.from;
      const mine = sender === currentUser.uid;
      const wrap = document.createElement('div');
      wrap.className = 'msgWrap ' + (mine ? 'me' : 'other');

      const div = document.createElement('div');
      div.id = 'msg_' + doc.id;
      div.className = 'msg ' + (mine ? 'me' : 'other');
      const time = m.createdAt ? m.createdAt.toDate().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '';
      
      let inner = '';
      if (m.replyTo) {
        inner += `<div class="replyQuote"><b>Ответ:</b> ${escapeHtml(m.replyTo.text || 'Медиафайл')}</div>`;
      }
      if (m.image) inner += `<img src="${m.image}" class="chatImage">`;
      if (m.audio) inner += `<audio controls src="${m.audio}"></audio>`;
      if (m.text) inner += escapeHtml(m.text) + (m.isEdited ? ' <small style="opacity:0.6">(изм.)</small>' : '');
      
      let ticks = '';
      if (mine) {
        ticks = `<span class="ticks" title="${m.read ? 'Просмотрено' : 'Отправлено'}">${m.read ? '✓✓' : '✓'}</span>`;
      }

      inner += `<span class="t">${time} ${ticks}</span>`;
      
      inner += `
        <div class="msgActions">
          <button class="replyBtn" title="Ответить">↩️</button>
          <button class="pinBtn" title="Закрепить">📌</button>
          ${mine && m.text ? '<button class="editBtn" title="Редактировать">✏️</button>' : ''}
          ${mine ? '<button class="delBtn" title="Удалить">✕</button>' : ''}
        </div>
      `;
      
      div.innerHTML = inner;

      const imgEl = div.querySelector('.chatImage');
      if (imgEl) {
        imgEl.onclick = (e) => {
          e.stopPropagation();
          openLightbox(m.image);
        };
      }

      const replyBtn = div.querySelector('.replyBtn');
      if (replyBtn) replyBtn.onclick = (e) => { e.stopPropagation(); startReply(m); };

      const pinBtn = div.querySelector('.pinBtn');
      if (pinBtn) pinBtn.onclick = (e) => { e.stopPropagation(); pinMessage(cid, doc.id, m, isGroup); };

      if (mine) {
        const del = div.querySelector('.delBtn');
        if (del) del.onclick = (e) => { e.stopPropagation(); deleteMessage(collectionRef, doc.id); };

        const edit = div.querySelector('.editBtn');
        if (edit) edit.onclick = (e) => { e.stopPropagation(); startEditMessage(doc.id, m.text); };
      }

      div.onclick = () => toggleEmojiBar(bar);
      wrap.appendChild(div);

      const reactions = m.reactions || {};
      const reactWrap = document.createElement('div');
      reactWrap.className = 'reactions';
      Object.keys(reactions).forEach(emoji => {
        const uids = reactions[emoji] || [];
        if (uids.length === 0) return;
        const pill = document.createElement('span');
        pill.className = 'reactionPill' + (uids.includes(currentUser.uid) ? ' mine' : '');
        pill.textContent = `${emoji} ${uids.length}`;
        pill.onclick = (e) => { e.stopPropagation(); toggleReaction(collectionRef, doc.id, emoji, uids.includes(currentUser.uid)); };
        reactWrap.appendChild(pill);
      });
      wrap.appendChild(reactWrap);

      const bar = document.createElement('div');
      bar.className = 'emojiBar';
      REACTION_EMOJIS.forEach(emoji => {
        const sp = document.createElement('span');
        sp.textContent = emoji;
        sp.onclick = (e) => {
          e.stopPropagation();
          const already = ((m.reactions && m.reactions[emoji]) || []).includes(currentUser.uid);
          toggleReaction(collectionRef, doc.id, emoji, already);
          bar.classList.remove('show');
        };
        bar.appendChild(sp);
      });
      wrap.appendChild(bar);

      box.appendChild(wrap);
    });
    box.scrollTop = box.scrollHeight;
  }

  function toggleEmojiBar(bar){
    document.querySelectorAll('.emojiBar.show').forEach(b => { if (b!==bar) b.classList.remove('show'); });
    bar.classList.toggle('show');
  }

  async function deleteMessage(colRef, msgId) {
    if (confirm("Удалить сообщение?")) {
      await colRef.doc(msgId).delete();
    }
  }

  async function pinMessage(chatId, msgId, msgData, isGrp) {
    const dataToSave = { ...msgData, id: msgId };
    const targetRef = isGrp ? db.collection('groups').doc(chatId) : db.collection('chats').doc(chatId);
    await targetRef.set({ pinnedMsg: dataToSave }, { merge: true });
  }

  function startEditMessage(msgId, text) {
    editingMsgId = msgId;
    const input = document.getElementById('msgInput');
    if (input) {
      input.value = text;
      input.focus();
    }
  }

  function startReply(msgData) {
    replyingToMsg = msgData;
    const replyBar = document.getElementById('replyBar');
    const replyTextPreview = document.getElementById('replyTextPreview');
    replyTextPreview.textContent = 'Ответ на: ' + (msgData.text || 'Медиасообщение');
    replyBar.classList.add('show');
    document.getElementById('replyCancelBtn').onclick = () => {
      replyingToMsg = null;
      replyBar.classList.remove('show');
    };
  }

  async function toggleReaction(colRef, msgId, emoji, alreadyReacted){
    const ref = colRef.doc(msgId);
    const fieldPath = `reactions.${emoji}`;
    await ref.update({
      [fieldPath]: alreadyReacted 
        ? firebase.firestore.FieldValue.arrayRemove(currentUser.uid)
        : firebase.firestore.FieldValue.arrayUnion(currentUser.uid)
    });
  }

  if (canWrite) {
    const send = async () => {
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text && !pendingImage) return;
      
      if (editingMsgId) {
        await collectionRef.doc(editingMsgId).update({
          text: text,
          isEdited: true
        });
        editingMsgId = null;
        input.value = '';
        return;
      }

      input.value = '';
      
      // СОБЛЮДЕНИЕ ПРАВИЛ: Передаем senderId
      const payload = {
        senderId: currentUser.uid,
        from: currentUser.uid,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        read: false
      };
      if (!isGroup) payload.to = targetObj.uid;
      if (text) payload.text = text;
      if (pendingImage) payload.image = pendingImage;
      if (replyingToMsg) {
        payload.replyTo = { text: replyingToMsg.text || '' };
        replyingToMsg = null;
        document.getElementById('replyBar').classList.remove('show');
      }

      pendingImage = null;
      document.getElementById('imgPreviewBar').classList.remove('show');
      
      await collectionRef.add(payload);
    };

    document.getElementById('sendBtn').onclick = send;
    const msgInput = document.getElementById('msgInput');
    msgInput.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
    
    if (!isGroup) {
      msgInput.addEventListener('input', () => {
        db.collection('chats').doc(cid).set({
          participants: [currentUser.uid, targetObj.uid],
          typing: { [currentUser.uid]: firebase.firestore.FieldValue.serverTimestamp() }
        }, { merge: true });
      });
    }

    const voiceBtn = document.getElementById('voiceBtn');
    voiceBtn.onclick = async () => {
      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];
          
          mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
          mediaRecorder.onstop = async () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.readAsDataURL(audioBlob);
            reader.onloadend = async () => {
              const base64Audio = reader.result;
              await collectionRef.add({
                senderId: currentUser.uid,
                from: currentUser.uid,
                audio: base64Audio,
                read: false,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
              });
            };
          };

          mediaRecorder.start();
          isRecording = true;
          voiceBtn.classList.add('recActive');
        } catch (err) {
          alert('Не удалось получить доступ к микрофону');
        }
      } else {
        mediaRecorder.stop();
        isRecording = false;
        voiceBtn.classList.remove('recActive');
      }
    };

    document.getElementById('attachBtn').onclick = () => document.getElementById('imgFileInput').click();
    document.getElementById('imgCancelBtn').onclick = () => {
      pendingImage = null;
      document.getElementById('imgPreviewBar').classList.remove('show');
    };
  }
}

function openLightbox(src) {
  const lightbox = document.getElementById('lightbox');
  const img = document.getElementById('lightboxImg');
  img.src = src;
  lightbox.classList.add('show');
}
document.getElementById('lightboxClose').onclick = () => document.getElementById('lightbox').classList.remove('show');
document.getElementById('lightbox').onclick = (e) => {
  if (e.target.id === 'lightbox') document.getElementById('lightbox').classList.remove('show');
};

document.getElementById('imgFileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  pendingImage = await resizeImage(file, 800, 0.6);
  document.getElementById('imgPreviewThumb').src = pendingImage;
  document.getElementById('imgPreviewBar').classList.add('show');
});

function resizeImage(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = () => {
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
          else { width = Math.round(width * maxDim / height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function escapeHtml(str){
  if (!str) return '';
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}
</script>
